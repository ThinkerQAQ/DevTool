#:schema https://developers.openai.com/codex/config-schema.json

# DevTool is the single project-aware MCP control plane. Stage 0 uses the Go
# toolchain only to launch DevTool itself; configured extensions dynamically
# contribute agent tools through the DevTool registry.
[mcp_servers.devtool]
command = "go"
args = ["run", "./cmd/devtool", "agent", "mcp", "--context", "codex"]
required = true
startup_timeout_sec = 300
tool_timeout_sec = 120
