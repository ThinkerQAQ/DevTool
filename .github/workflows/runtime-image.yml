name: Runtime Image

# Experimental, maintenance-paused repository: do not publish images on every push.
on:
  workflow_dispatch:

concurrency:
  group: runtime-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  runtime-image:
    # Manual dispatch plus explicit opt-in; image redistribution needs separate license review.
    if: vars.DEVTOOL_ENABLE_IMAGE_PUBLISH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and publish runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/runtime/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/thinkerqaq/devtool-runtime:${{ github.sha }}
            ${{ github.ref_name == 'main' && 'ghcr.io/thinkerqaq/devtool-runtime:latest' || '' }}
