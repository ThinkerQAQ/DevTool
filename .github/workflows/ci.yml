name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: go test ./...
      - run: go -C devcontrol test ./...
      - name: Install Dagger
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=1.0.0-beta.15 BIN_DIR=$HOME/.local/bin sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Portable invoke integration
        run: DEVTOOL_DAGGER_INTEGRATION=1 go test ./extensions/runtime/dagger -run TestInvokeRealDagger -v
      - name: Inspect through project extension
        run: go run ./cmd/devtool project inspect --json
      - name: Code intelligence through configured DevEnvironment
        run: |
          go run ./cmd/devtool code doctor
          go run ./cmd/devtool code verify
          go run ./cmd/devtool code graph query get_module_summary '{"path":"core"}'
      - name: Reject project-local code intelligence bootstrap
        run: |
          if git grep -n -E 'npm (install|exec)|pip install|uv tool install|go install .*gopls|CODEGRAPH_VERSION|SERENA_VERSION|GOPLS_VERSION' -- ':!docs/**' ':!.github/workflows/**' ':!.serena/**'; then
            echo "project-local code-intelligence dependency bootstrap is forbidden"
            exit 1
          fi
      - name: Portable runtime doctor
        run: go run ./cmd/devtool runtime.doctor
      - name: Self-host build
        run: go run ./cmd/devtool build
      - name: Self-host N+1 to N+2
        run: |
          cp .devtool/out/devtool-next /tmp/devtool-n1
          /tmp/devtool-n1 project inspect --json
          /tmp/devtool-n1 runtime.doctor
          /tmp/devtool-n1 build
          cp .devtool/out/devtool-next /tmp/devtool-n2
          /tmp/devtool-n2 project inspect --json
          cmp /tmp/devtool-n1 /tmp/devtool-n2
      - name: Self-host verify
        run: go run ./cmd/devtool verify
      - name: Self-host package
        run: go run ./cmd/devtool package
